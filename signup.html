<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BorrowBox | Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <div class="brand-panel">
      <img src="assets/borrowbox-logo.png" alt="BorrowBox Logo" class="main-logo">
      <h1>One account.<br><span>Everything you need.</span></h1>
      <p>Create your BorrowBox profile and start sharing with your campus community.</p>
    </div>

    <div class="form-panel">
      <div class="login-card signup-card">
        <div class="mobile-logo">
          <img src="assets/borrowbox-logo.png" alt="BorrowBox Logo">
        </div>

        <p class="small-heading">GET STARTED</p>
        <h2>Create your account</h2>
        <p class="subtext">Join your campus borrowing community.</p>

        <form id="signupForm">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" required>

          <label for="college">College / Institution</label>
          <input type="text" id="college" placeholder="Enter your college" required>

          <label for="signupEmail">College Email</label>
          <input type="email" id="signupEmail" placeholder="you@college.edu" required>

          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password" required>

          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

          <button type="submit" class="primary-btn">Create Account</button>
        </form>

        <p id="signupMessage" class="message"></p>

        <p class="back-text">Already have an account? <a href="index.html">Login</a></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
